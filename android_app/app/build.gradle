plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is read from keystore.properties, which is gitignored.
// Without it a release build still succeeds but is unsigned, so CI does not
// break for contributors who do not hold the key.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.cargoresq.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.cargoresq.driver"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Lifecycle-aware coroutines, so network work is cancelled with the screen.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // REST and the live WebSocket feed.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // OpenStreetMap. No API key, and the same tiles the desktop console uses,
    // so the two clients show the driver and the dispatcher the same picture.
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Fused location where Play Services exists; LocationManager is the
    // fallback, so the app still works on a device without it.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Encrypted token storage.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
