<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Cyan glow gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="880" height="240" rx="16" fill="url(#darkBgGrad)" />
  
  <!-- Subtle accent line -->
  <line x1="40" y1="205" x2="840" y2="205" stroke="#1E293B" stroke-width="1.5" />

  <!-- Winged Shield Emblem Group -->
  <g transform="translate(60, 32)">
    <!-- Outer Shield Border -->
    <path d="M70,8 L126,28 C126,80 105,126 70,146 C35,126 14,80 14,28 Z" 
          fill="url(#shieldFill)" stroke="#00E5FF" stroke-width="3" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- Inner Shield Accent Line -->
    <path d="M70,18 L114,34 C114,76 96,114 70,132 C44,114 26,76 26,34 Z" 
          fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.4" stroke-dasharray="6,4" />

    <!-- Left Wing Feathers -->
    <g stroke="#00E5FF" stroke-width="2.5" fill="#00E5FF" fill-opacity="0.2" filter="url(#neonGlow)">
      <path d="M16,42 Q -8,38 -24,46 Q -10,56 16,56 Z" />
      <path d="M18,58 Q -4,56 -18,66 Q -6,74 20,72 Z" />
      <path d="M22,74 Q 2,74 -8,84 Q 4,90 26,86 Z" />
    </g>

    <!-- Right Wing Feathers -->
    <g stroke="#00E5FF" stroke-width="2.5" fill="#00E5FF" fill-opacity="0.2" filter="url(#neonGlow)">
      <path d="M124,42 Q 148,38 164,46 Q 150,56 124,56 Z" />
      <path d="M122,58 Q 144,56 158,66 Q 146,74 120,72 Z" />
      <path d="M118,74 Q 138,74 148,84 Q 136,90 114,86 Z" />
    </g>

    <!-- Center Medical / Velocity Rescue Cross -->
    <g filter="url(#neonGlow)">
      <path d="M58,40 H82 V60 H102 V84 H82 V104 H58 V84 H38 V60 H58 Z" 
            fill="#00E5FF" />
      <!-- Inner faceted highlight -->
      <polygon points="70,42 70,102 68,102 68,42" fill="#FFFFFF" opacity="0.8" />
      <polygon points="40,71 100,71 100,73 40,73" fill="#FFFFFF" opacity="0.8" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(265, 108)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif" 
          font-size="62" font-weight="900" letter-spacing="2">
      <tspan fill="#F8FAFC">CARGO</tspan><tspan fill="#00E5FF" filter="url(#neonGlow)">RESQ</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="3.5">
      INTELLIGENT IN-TRANSIT CARGO RESCUE
    </text>
  </g>

  <!-- Badges / Pill Tags -->
  <g transform="translate(265, 172)">
    <rect width="138" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#00E5FF" />
    <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      CROSS-CARRIER
    </text>

    <rect x="148" width="138" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="162" cy="12" r="4" fill="#10B981" />
    <text x="174" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      ESCROW LEDGER
    </text>

    <rect x="296" width="154" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="310" cy="12" r="4" fill="#F59E0B" />
    <text x="322" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      COLD-CHAIN IOT
    </text>
  </g>
</svg>
