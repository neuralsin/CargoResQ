apiVersion: v1
kind: Secret
metadata:
  name: cargoresq-api-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://user:replace-me@postgres.example.com:5432/cargoresq
  JWT_SECRET: replace-with-a-random-32-character-secret
  REDIS_URL: redis://redis.example.com:6379
  KAFKA_BOOTSTRAP_SERVERS: kafka.example.com:9092
  ALLOWED_ORIGINS: https://ops.cargoresq.com,https://driver.cargoresq.com
  OSRM_BASE_URL: https://routing.example.com
