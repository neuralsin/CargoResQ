apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargoresq-api
  labels:
    app: cargoresq-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cargoresq-api
  template:
    metadata:
      labels:
        app: cargoresq-api
    spec:
      containers:
        - name: api
          image: cargoresq/core-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cargoresq-service
spec:
  type: ClusterIP
  selector:
    app: cargoresq-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cargoresq-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cargoresq-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
