apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargoresq-api
  labels:
    app: cargoresq-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cargoresq-api
  template:
    metadata:
      labels:
        app: cargoresq-api
    spec:
      containers:
        - name: api
          image: cargoresq/core-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: "production"
          envFrom:
            - secretRef:
                name: cargoresq-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cargoresq-service
spec:
  type: ClusterIP
  selector:
    app: cargoresq-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cargoresq-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cargoresq-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
